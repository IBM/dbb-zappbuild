# Application properties used by zAppBuild/languages/Transfer_USS.groovy

#
# Comma-separated list of required build properties to validate before running Transfer_USS.groovy
transfer_uss_requiredBuildProperties=transfer_uss_targetDir,transfer_uss_deployType

# Default deployType when not overridden in file.properties
transfer_uss_deployType=USS

#
# Default target USS staging directory under workspace
transfer_uss_targetDir=${workspace}/ussfiles
